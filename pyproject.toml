[tool.poetry]
name = "bookmind"
version = "0.1.0"
description = "AI-powered book recommendation engine for adults and children"
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"

# API
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
pydantic = "^2.7.0"
pydantic-settings = "^2.2.0"
python-multipart = "^0.0.9"

# Agent
anthropic = "^0.28.0"
langgraph = "^0.1.0"
langchain-anthropic = "^0.1.0"
langchain-core = "^0.2.0"

# Database
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.29.0"
alembic = "^1.13.0"
pgvector = "^0.3.0"

# Cache / Queue
redis = {extras = ["asyncio"], version = "^5.0.0"}
arq = "^0.26.0"  # async job queue (Redis-based)

# HTTP clients
httpx = "^0.27.0"
aiohttp = "^3.9.0"

# Embeddings
openai = "^1.30.0"   # text-embedding-3-small

# Email
sendgrid = "^6.11.0"

# Utils
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-dotenv = "^1.0.0"
tenacity = "^8.3.0"   # retry logic
structlog = "^24.1.0" # structured logging

# Observability
langfuse = "^2.0.0"

[tool.poetry.dev-dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"
ruff = "^0.4.0"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
